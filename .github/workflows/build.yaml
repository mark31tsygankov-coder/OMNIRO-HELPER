name: Build OMNIRO ONLANE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name "OMNIRO ONLANE" --icon icon.ico --add-data "laws.json;." --add-data "icon.png;." main.py
      - run: Copy-Item "dist/OMNIRO ONLANE.exe" "OMNIRO_ONLANE.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: OMNIRO-ONLANE
          path: OMNIRO_ONLANE.exe
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: OMNIRO ONLANE build ${{ github.run_number }}
          files: OMNIRO_ONLANE.exe
          make_latest: true
