name: Build OMNIRO ONLANE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name "OMNIRO ONLANE" --icon icon.ico --add-data "laws.json;." --add-data "icon.png;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: OMNIRO-ONLANE
          path: dist/OMNIRO ONLANE.exe
